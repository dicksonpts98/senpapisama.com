<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENPAPI-SAMA — Art Gallery</title>
  <meta name="description" content="SENPAPI-SAMA (aka WUSENSEI) — Digital Artist & Illustrator. The gallery.">
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="progress" id="progress"></div>

  <!-- ── NAV ─────────────────────────────────────────────── -->
  <header class="nav" id="nav">
    <a class="nav-name" id="nav-home" href="#top">SENPAPI-SAMA<span class="nav-dot">●</span></a>
    <nav class="nav-links">
      <button class="nav-link active" data-section="gallery">Gallery</button>
      <button class="nav-link" data-section="table">Table Display</button>
      <button class="nav-link" data-section="about">About</button>
    </nav>
  </header>

  <!-- ── HERO ────────────────────────────────────────────── -->
  <section class="hero" id="top">
    <p class="hero-eyebrow">Digital Artist &amp; Illustrator — aka Wusensei</p>
    <h1 class="hero-name">SENPAPI<span class="accent">—</span>SAMA</h1>
    <div class="hero-meta">
      <span><b id="meta-works">0</b> works</span>
      <span class="meta-sep">✦</span>
      <span><b id="meta-series">0</b> series</span>
      <span class="meta-sep">✦</span>
      <span>anime · games · originals</span>
    </div>
  </section>

  <!-- ── MARQUEE ─────────────────────────────────────────── -->
  <div class="marquee" aria-hidden="true">
    <div class="marquee-track" id="marquee-track"></div>
  </div>

  <!-- ── FILTERS ─────────────────────────────────────────── -->
  <div class="filters-wrap" id="filters-wrap">
    <div class="filters" id="filters"></div>
  </div>

  <!-- ── GALLERY (masonry, uncropped) ────────────────────── -->
  <main class="gallery" id="gallery-section">
    <div class="masonry" id="masonry"></div>
  </main>

  <!-- ── TABLE DISPLAY ───────────────────────────────────── -->
  <section class="booth" id="booth-section" hidden>
    <div class="section-head">
      <h2>Table Display</h2>
      <p>Booth setups from conventions</p>
    </div>
    <div class="booth-grid" id="booth-grid"></div>
  </section>

  <!-- ── ABOUT (slide-over panel) ────────────────────────── -->
  <div class="about" id="about-panel" aria-hidden="true">
    <div class="about-backdrop" id="about-backdrop"></div>
    <aside class="about-card">
      <button class="about-close" id="about-close" aria-label="Close">✕</button>
      <img class="about-logo" src="/assets/logo.png" alt="SENPAPI-SAMA logo">
      <h2 class="about-name"></h2>
      <p class="about-tagline"></p>
      <p class="about-bio"></p>
      <div class="about-links" id="about-links"></div>
    </aside>
  </div>

  <!-- ── LIGHTBOX ────────────────────────────────────────── -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
    <button class="lb-arrow lb-prev" id="lb-prev" aria-label="Previous">←</button>
    <button class="lb-arrow lb-next" id="lb-next" aria-label="Next">→</button>
    <figure class="lb-stage">
      <img id="lb-image" src="" alt="">
      <figcaption class="lb-caption">
        <span class="lb-series"></span>
        <h3 class="lb-title"></h3>
        <span class="lb-count"></span>
      </figcaption>
    </figure>
  </div>

  <!-- ── FOOTER ──────────────────────────────────────────── -->
  <footer class="footer">
    <p>© SENPAPI-SAMA — all artworks are original creations</p>
    <a class="footer-alt" href="/classic">view classic version →</a>
  </footer>

  <script src="/data/artworks.js"></script>
  <script src="/main.js"></script>
</body>
</html>
